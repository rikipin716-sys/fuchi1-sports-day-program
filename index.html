<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動会 選手マップ（サンプル）</title>
<style>
:root{--bg:#f2f5ee;--card:#fff;--ink:#1d2a22;--sub:#5d6b62;--line:#d5ddd0;--g:#2f6b3f;--hi:#e8a21a;--hiink:#3a2600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#1a2a20;--ink:#e9f0e8;--sub:#9db0a2;--line:#2d4234;--g:#6fbf84;--hi:#f0b232;--hiink:#2a1c00}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:0 14px 40px}
header{padding:20px 0 10px}
h1{font-size:22px;line-height:1.35;margin:0 0 4px}
.meta{color:var(--sub);font-size:13px;margin:0}
.badge{display:inline-block;background:var(--hi);color:var(--hiink);font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-bottom:6px}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:14px;padding:9px 0;border:2px solid var(--g);background:transparent;color:var(--g);border-radius:10px}
.tabs button[aria-pressed=true]{background:var(--g);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
input[type=search]{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{flex:none;font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.p{background:var(--card);border:2px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.p.sel{border-color:var(--hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 40%,transparent)}
.p>button{all:unset;display:flex;width:100%;box-sizing:border-box;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.p>button:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.gr{flex:none;width:38px;height:38px;border-radius:50%;background:var(--g);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;text-align:center;line-height:1.1}
.nm{font-weight:700}
.ev{font-size:12.5px;color:var(--sub)}
.detail{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
.p.open .detail{display:block}
.detail h3{font-size:14px;margin:14px 0 2px}
.detail p{margin:6px 0 4px;font-size:14px;color:var(--sub)}
.map{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
.map g[data-i]{cursor:pointer}
.map g[data-i]:focus-visible{outline:none}
.map g[data-i]:focus-visible circle{stroke:var(--ink);stroke-width:3}
.glow{animation:gl 1.4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.15}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
.zt{display:flex;align-items:center;gap:8px;margin:6px 0}
.zt button{font:inherit;font-size:14px;min-width:44px;min-height:40px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.zt span{min-width:48px;text-align:center;font-size:13px;color:var(--sub)}
.zv{overflow:auto;max-height:70vh;border-radius:8px;border:1px solid var(--line)}
.cap{font-size:14px;min-height:44px;margin:6px 0 10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--sub)}
.cap b{color:var(--ink)}
.tw{max-height:260px;overflow:auto;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:18px}
.t{font-size:14px;width:100%;border-collapse:collapse;margin:0}
.t th,.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.t th{color:var(--sub);font-weight:600;font-size:12.5px;position:sticky;top:0;background:var(--card)}
.t tr[data-i]{cursor:pointer}
.t tr.hit td{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.t tr.sel td{background:var(--hi);color:var(--hiink);font-weight:700}
h2{font-size:17px;margin:18px 0 6px}
select{width:100%;font:inherit;font-weight:700;padding:11px 14px;border:2px solid var(--g);border-radius:10px;background:var(--card);color:var(--ink);margin:6px 0 2px}
select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.note{font-size:12.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<span class="badge">サンプル（ダミーデータ）</span>
<h1>運動会 選手マップ</h1>
<p class="meta">淵一少年野球部／2026年10月　名前や図の点を押すと、位置が一覧と連動して光ります</p>
</header>
<input type="search" id="q" placeholder="名前で探す（マップ・一覧でも光ります）" aria-label="名前で探す">
<div class="tabs" role="group" aria-label="表示切り替え">
<button data-v="players" aria-pressed="true">選手から探す</button>
<button data-v="events" aria-pressed="false">種目ごとに見る</button>
</div>

<section id="players">
<div class="chips" id="chips"></div>
<div id="list"></div>
</section>

<section id="events" hidden>
<select id="pg" aria-label="種目を選ぶ"></select>
<div id="sRelay">
<h2 id="hRelay"></h2>
<div class="zt"><button data-z="mRelay" data-d="-1" aria-label="縮小">－</button><span id="zmRelay">100%</span><button data-z="mRelay" data-d="1" aria-label="拡大">＋</button><button data-z="mRelay" data-d="0">元の大きさ</button></div>
<div class="zv" id="mRelay"></div>
<p class="cap" id="cRelay"></p>
<div class="tw" id="wRelay"><table class="t" id="tRelay"></table></div>
</div>

<div id="sDance">
<h2 id="hDance"></h2>
<div class="chips" id="fchips"></div>
<div class="zt"><button data-z="mDance" data-d="-1" aria-label="縮小">－</button><span id="zmDance">100%</span><button data-z="mDance" data-d="1" aria-label="拡大">＋</button><button data-z="mDance" data-d="0">元の大きさ</button></div>
<div class="zv" id="mDance"></div>
<p class="cap" id="cDance"></p>
<div class="tw" id="wDance"><table class="t" id="tDance"></table></div>
</div>
</section>

<p class="note">立ち位置は各ご家庭から集めた情報をもとに作っています。図は見やすくした簡略図で、学校配布のプログラムが正です。</p>

<script>
// ===== 設定：種目・隊形はここを書き換えます =====
var G5=["1組","2組","3組","4組","5組"],CLS=["1A","1B","2A","2B","3A","3B","4A","4B","5A","5B"],LANES=5;
// 種目：grades＝出場する学年
var PG=[
 {id:"relay",no:7,short:"ワープリレー",name:"ワープリレー",grades:[2,3,4,5,6]},
 {id:"dance",no:14,short:"団体演技",name:"団体演技「魅せるぞ！6年間の軌跡」",grades:[1,2,3,4,5,6]}
];
// 団体演技の隊形：kind＝cols(列)/circle(円)/radial(花)/lines(横線)、groups＝並びの区分、per＝1区分の最大人数
var FM=[
 {id:"f1",name:"1〜3曲目はじめ",kind:"cols",groups:CLS,per:14},
 {id:"f2",name:"3曲目移動〜6曲目途中",kind:"circle",groups:G5,per:12},
 {id:"f3",name:"6曲目【2】花",kind:"radial",groups:G5,per:10},
 {id:"f4",name:"6曲目【3】風",kind:"lines",groups:G5,per:14}
];
// 選手（ダミー）。隊形ごとに位置が違う場合は f:{f2:{g:"2組",n:7}} のように上書きできます
var P=[
 {n:"はると",g:2,cls:"2A",dance:5,lane:2,leg:1},
 {n:"はる",g:2,cls:"2A",dance:6,lane:2,leg:2},
 {n:"そうた",g:1,cls:"1A",dance:3},
 {n:"りく",g:3,cls:"3B",dance:8,lane:4,leg:3},
 {n:"そら",g:3,cls:"3A",dance:4,lane:4,leg:1},
 {n:"ゆうま",g:4,cls:"4A",dance:2,lane:3,leg:4},
 {n:"かいと",g:5,cls:"5A",dance:11,lane:5,leg:2},
 {n:"れん",g:6,cls:"5B",dance:6,lane:1,leg:5}
];
// ===== ここから表示処理 =====
var $=function(i){return document.getElementById(i)};
var sel=-1,fi=0,cur="all",OP={},Z={mRelay:0,mDance:0},ZS=[1,1.5,2,3];
var HINT="点や表の行を押すと、誰の位置かが表示されます";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function r1(v){return +v.toFixed(1)}
function gt(a){return a.length===6?"全学年":a.length===1?a[0]+"年":a[0]+"〜"+a[a.length-1]+"年"}
function joins(p,id){return PG.some(function(x){return x.id===id&&x.grades.indexOf(p.g)>-1})}
function pos(p,f){return (p.f&&p.f[f.id])||{g:f.kind==="cols"?p.cls:p.cls.charAt(0)+"組",n:p.dance}}
function ptxt(p,f){var q=pos(p,f);return esc(q.g)+"の"+q.n+"番目"}
function match(p){var q=$("q").value.trim();return !!q&&p.n.indexOf(q)>-1}

function dot(i,x,y,r,p){
 var m=match(p),on=i===sel,q=$("q").value.trim(),dim=q&&!m&&!on;x=r1(x);y=r1(y);
 var gl=(m||on)?'<circle class="glow" cx="'+x+'" cy="'+y+'" r="'+(r+8)+'" fill="var(--hi)"/><circle cx="'+x+'" cy="'+y+'" r="'+(r+4)+'" fill="none" stroke="var(--hi)" stroke-width="3"/>':"";
 return '<g data-i="'+i+'" tabindex="0" role="button" aria-label="'+esc(p.n)+'"'+(dim?' opacity=".3"':"")+'>'+gl+'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(on?"var(--hi)":"var(--g)")+'" stroke="'+(on?"var(--hiink)":"var(--bg)")+'" stroke-width="2"/><text x="'+x+'" y="'+(y+3.5)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+(on?"var(--hiink)":"var(--bg)")+'" pointer-events="none">'+esc(p.n.charAt(0))+'</text></g>';
}
var STAGE='<rect x="110" y="4" width="100" height="22" rx="4" fill="none" stroke="currentColor" opacity=".6"/><text x="160" y="20" text-anchor="middle" font-size="12" fill="currentColor">朝礼台</text>';
function geo(f){
 var gs=f.groups,L=gs.length,sp=360/L,b="",pt,rad=function(d){return d*Math.PI/180};
 function lab(x,y,c,an){return '<text x="'+r1(x)+'" y="'+r1(y)+'" text-anchor="'+(an||"middle")+'" font-size="11" fill="var(--sub)">'+c+'</text>'}
 if(f.kind==="cols"){
  gs.forEach(function(c,k){var x=26+k*29;b+='<line x1="'+x+'" y1="40" x2="'+x+'" y2="250" stroke="var(--line)" stroke-width="2"/>'+lab(x,266,c)});
  pt=function(k,n){return[26+k*29,40+Math.min(n,f.per)*(210/f.per)]};
 }else if(f.kind==="circle"){
  b='<ellipse cx="160" cy="150" rx="120" ry="82" fill="none" stroke="var(--line)" stroke-width="2"/>';
  gs.forEach(function(c,k){var a=rad(-90+k*sp),m=rad(-90+(k+.5)*sp);
   b+='<line x1="'+r1(160+112*Math.cos(a))+'" y1="'+r1(150+74*Math.sin(a))+'" x2="'+r1(160+128*Math.cos(a))+'" y2="'+r1(150+90*Math.sin(a))+'" stroke="var(--sub)" stroke-width="2"/>'+lab(160+138*Math.cos(m),150+100*Math.sin(m)+4,c)});
  pt=function(k,n){var t=rad(-90+(k+(Math.min(n,f.per)-.5)/f.per)*sp);return[160+120*Math.cos(t),150+82*Math.sin(t)]};
 }else if(f.kind==="radial"){
  gs.forEach(function(c,k){var a=rad(-90+(k+.5)*sp),ca=Math.cos(a),sa=Math.sin(a);
   b+='<line x1="160" y1="140" x2="'+r1(160+104*ca)+'" y2="'+r1(140+104*sa)+'" stroke="var(--line)" stroke-width="2"/>'+lab(160+118*ca,140+118*sa+4,c)});
  pt=function(k,n){var a=rad(-90+(k+.5)*sp),r=14+(Math.min(n,f.per)-1)*(88/(f.per-1));return[160+r*Math.cos(a),140+r*Math.sin(a)]};
 }else{
  gs.forEach(function(c,k){var y=64+k*42;b+='<line x1="24" y1="'+y+'" x2="306" y2="'+y+'" stroke="var(--line)" stroke-width="2"/>'+lab(24,y-6,c,"start")});
  pt=function(k,n){return[30+Math.min(n,f.per)*(270/f.per),64+k*42]};
 }
 return{b:STAGE+b,pt:pt};
}
// 団体演技マップ：p を渡すとその選手だけ、省略すると全員
function fmap(f,p){
 var g=geo(f),h='<svg class="map" viewBox="0 0 320 270" role="group" aria-label="団体演技 '+esc(f.name)+'">'+g.b;
 if(p){var q=pos(p,f),k=f.groups.indexOf(q.g);if(k>-1){var c=g.pt(k,q.n),x=r1(c[0]),y=r1(c[1]);h+='<circle cx="'+x+'" cy="'+y+'" r="10" fill="var(--hi)" stroke="var(--hiink)" stroke-width="2"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--hiink)">'+q.n+'</text>'}}
 else P.forEach(function(s,i){if(!joins(s,"dance"))return;var o=pos(s,f),k=f.groups.indexOf(o.g);if(k>-1){var c=g.pt(k,o.n);h+=dot(i,c[0],c[1],8,s)}});
 return h+"</svg>";
}
function relay(p){
 var h='<svg class="map" viewBox="0 0 320 190" role="group" aria-label="ワープリレーの位置"><text x="160" y="16" text-anchor="middle" font-size="12" fill="currentColor">朝礼台</text>';
 for(var l=1;l<=LANES;l++){var y=26+(l-1)*28,on=p&&l===p.lane;
  h+='<rect x="40" y="'+y+'" width="260" height="22" rx="11" fill="'+(on?"var(--g)":"none")+'" stroke="'+(on?"var(--g)":"var(--line)")+'" stroke-width="2"/><text x="20" y="'+(y+16)+'" text-anchor="middle" font-size="12" font-weight="'+(on?700:400)+'" fill="'+(on?"var(--g)":"var(--sub)")+'">'+l+'</text>'}
 if(p){var cx=60+(p.leg-1)*45,cy=26+(p.lane-1)*28+11;h+='<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="var(--hi)" stroke="var(--hiink)" stroke-width="2"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--hiink)">'+p.leg+'</text>'}
 else P.forEach(function(s,i){if(joins(s,"relay"))h+=dot(i,60+(s.leg-1)*45,26+(s.lane-1)*28+11,10,s)});
 return h+'<text x="40" y="182" font-size="11" fill="var(--sub)">スタート側</text><text x="300" y="182" text-anchor="end" font-size="11" fill="var(--sub)">ゴール側</text></svg>';
}
function setMap(id,h){var el=$(id),sl=el.scrollLeft,st=el.scrollTop;el.innerHTML=h;el.firstChild.style.width=(ZS[Z[id]]*100)+"%";el.scrollLeft=sl;el.scrollTop=st}
function renderMaps(){setMap("mRelay",relay());setMap("mDance",fmap(FM[fi]))}

function detail(p){
 var h="";
 if(joins(p,"relay"))h+='<h3>No.7 ワープリレー</h3><p>'+p.lane+'レーン・'+p.leg+'走目</p>'+relay(p);
 if(joins(p,"dance")){h+='<h3>No.14 団体演技</h3>';FM.forEach(function(f){h+='<p>'+esc(f.name)+'：'+ptxt(p,f)+'</p>'+fmap(f,p)})}
 return h;
}
function renderList(){
 var q=$("q").value.trim(),h="";
 P.forEach(function(p,i){
  if(!(cur==="all"||String(p.g)===cur)||(q&&p.n.indexOf(q)<0))return;
  var ev=PG.filter(function(x){return joins(p,x.id)}).map(function(x){return x.short}).join("／");
  h+='<div class="p'+(OP[i]?" open":"")+(i===sel?" sel":"")+'"><button aria-expanded="'+!!OP[i]+'" data-k="'+i+'"><span class="gr">'+p.g+'<br>年</span><span><span class="nm">'+esc(p.n)+'</span><br><span class="ev">'+ev+'</span></span></button><div class="detail">'+(OP[i]?detail(p):"")+'</div></div>';
 });
 $("list").innerHTML=h||'<p class="meta">該当する選手がいません。名前や学年を変えて探してください。</p>';
}
function renderChips(){
 var h="";["all",1,2,3,4,5,6].forEach(function(g){h+='<button data-g="'+g+'" aria-pressed="'+(String(g)===cur)+'">'+(g==="all"?"全員":g+"年")+'</button>'});
 $("chips").innerHTML=h;
 $("fchips").innerHTML=FM.map(function(f,k){return '<button data-f="'+k+'" aria-pressed="'+(k===fi)+'">'+esc(f.name)+'</button>'}).join("");
}
function row(i,c){return '<tr data-i="'+i+'"'+(i===sel?' class="sel"':match(P[i])?' class="hit"':"")+'>'+c+'</tr>'}
function scrollRow(id){var w=$(id),r=w.querySelector("tr.sel");if(r)w.scrollTop=r.offsetTop-w.clientHeight/2+r.offsetHeight/2}
function renderEvents(){
 var f=FM[fi],r='<tr><th>レーン</th><th>走順</th><th>選手</th></tr>',d='<tr><th>区分</th><th>番目</th><th>選手</th></tr>',ix=P.map(function(_,i){return i});
 $("hRelay").textContent="No.7 "+PG[0].name+"（"+gt(PG[0].grades)+"）";
 $("hDance").textContent="No.14 "+PG[1].name+"（"+gt(PG[1].grades)+"）";
 ix.filter(function(i){return joins(P[i],"relay")}).sort(function(a,b){return P[a].lane-P[b].lane||P[a].leg-P[b].leg}).forEach(function(i){var p=P[i];r+=row(i,'<td>'+p.lane+'レーン</td><td>'+p.leg+'走目</td><td>'+esc(p.n)+'（'+p.g+'年）</td>')});
 ix.filter(function(i){return joins(P[i],"dance")}).sort(function(a,b){var x=pos(P[a],f),y=pos(P[b],f);return f.groups.indexOf(x.g)-f.groups.indexOf(y.g)||x.n-y.n}).forEach(function(i){var p=P[i],o=pos(p,f);d+=row(i,'<td>'+esc(o.g)+'</td><td>'+o.n+'番目</td><td>'+esc(p.n)+'（'+p.g+'年）</td>')});
 $("tRelay").innerHTML=r;$("tDance").innerHTML=d;scrollRow("wRelay");scrollRow("wDance");
}
function caps(){
 var p=P[sel];
 if(!p){$("cRelay").textContent=HINT;$("cDance").textContent=HINT;return}
 var w='<b>'+esc(p.n)+'</b>（'+p.g+'年）　';
 $("cRelay").innerHTML=w+(joins(p,"relay")?p.lane+'レーン・'+p.leg+'走目':'この種目には出ません');
 $("cDance").innerHTML=w+(joins(p,"dance")?esc(FM[fi].name)+'：'+ptxt(p,FM[fi]):'この種目には出ません');
}
function refresh(){renderList();renderMaps();renderEvents();caps()}
function pick(t){
 sel=+t.getAttribute("data-i");var m=t.closest("#mRelay")?"#mRelay":t.closest("#mDance")?"#mDance":"";
 refresh();
 if(m){var a=document.querySelector(m+" g[data-i='"+sel+"']");if(a)a.focus()}
}
$("list").addEventListener("click",function(e){
 var b=e.target.closest("button[data-k]");if(!b)return;
 var i=+b.getAttribute("data-k");OP[i]=!OP[i];if(OP[i])sel=i;else if(sel===i)sel=-1;refresh();
});
$("events").addEventListener("click",function(e){var t=e.target.closest("[data-i]");if(t)pick(t)});
$("events").addEventListener("keydown",function(e){var t=e.target.closest&&e.target.closest("g[data-i]");if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(t)}});
$("chips").addEventListener("click",function(e){var b=e.target.closest("button[data-g]");if(!b)return;cur=b.getAttribute("data-g");renderChips();renderList()});
$("fchips").addEventListener("click",function(e){var b=e.target.closest("button[data-f]");if(!b)return;fi=+b.getAttribute("data-f");renderChips();renderMaps();renderEvents();caps()});
$("q").addEventListener("input",refresh);
document.addEventListener("click",function(e){
 var b=e.target.closest("button[data-z]");if(!b)return;
 var id=b.getAttribute("data-z"),d=+b.getAttribute("data-d");
 Z[id]=d===0?0:Math.max(0,Math.min(ZS.length-1,Z[id]+d));renderMaps();$("z"+id).textContent=Math.round(ZS[Z[id]]*100)+"%";
});
document.querySelector(".tabs").addEventListener("click",function(e){
 var b=e.target.closest("button[data-v]");if(!b)return;
 document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
 $("players").hidden=b.dataset.v!=="players";$("events").hidden=b.dataset.v!=="events";
 if(b.dataset.v==="events")renderEvents();
});
var pgSel="relay";
function renderPg(){
 $("pg").innerHTML=PG.map(function(x){return '<option value="'+x.id+'"'+(x.id===pgSel?" selected":"")+'>No.'+x.no+' '+esc(x.short)+'（'+gt(x.grades)+'）</option>'}).join("");
 $("sRelay").hidden=pgSel!=="relay";$("sDance").hidden=pgSel!=="dance";
}
$("pg").addEventListener("change",function(){pgSel=$("pg").value;renderPg();renderEvents()});
renderPg();renderChips();refresh();
</script>
